<script>

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const FONT_D = '"Fraunces", Georgia, serif', FONT_B = '"Lora", Georgia, serif';

const GAME_VERSION = '1.0.74'; // keep in step with package.json
const W = 1280, H = 800, T = 40, COLS = 32, ROWS = 20, RL = 400, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px'; }
addEventListener('resize', fit); fit();
function hash(x, y, i) { let h = (x * 374761393 + y * 668265263 + i * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

/* ------------------------------ save ------------------------------ */
const SAVE_KEY = 'wick-and-shade-save-v1';
let save = { unlocked: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s.unlocked === 'number') save = Object.assign(save, s); } catch (e) {}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
let run = { deaths: [0, 0], abandon: 0, throws: 0, waves: 0, start: 0 };
// options (Options menu on the title screen and in the pause menu)
const OPT_KEY = 'wick-and-shade-options-v1';
let opts = { music: 6, sfx: 8, narrator: 'wait', rumble: true, speed: 100 };
try { const o = JSON.parse(localStorage.getItem(OPT_KEY)); if (o && typeof o === 'object') opts = Object.assign(opts, o); } catch (e) {}
function writeOpts() { try { localStorage.setItem(OPT_KEY, JSON.stringify(opts)); } catch (e) {} applyOpts(); }
function applyOpts() {
  if (musicBus) musicBus.gain.value = (opts.music / 10) ** 1.5 * 1.6;
  if (sfxBus) sfxBus.gain.value = (opts.sfx / 10) ** 1.5;

}

/* ------------------------------ audio ------------------------------ */
let AC = null, master = null, musicBus = null, sfxBus = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.connect(master); sfxBus = AC.createGain(); sfxBus.connect(master); applyOpts();

}
function tone(f, d, type = 'sine', v = 0.2, f2 = null, delay = 0, bus = null) {

}
const SFX = {
  jump() { tone(380, 0.13, 'triangle', 0.1, 640); },
  sjump() { tone(200, 0.16, 'sine', 0.14, 300); },
  land() { tone(150, 0.07, 'sine', 0.07, 90); },
  tick(hi) { tone(hi ? 1500 : 1150, 0.035, 'square', 0.025); },
  plate(on) { tone(on ? 620 : 420, 0.12, 'square', 0.04, on ? 880 : 300); },
  door() { tone(160, 0.35, 'sawtooth', 0.025, 110); },
  die() { tone(520, 0.45, 'sawtooth', 0.06, 70); },
  pick() { tone(880, 0.09, 'triangle', 0.09, 1320); },
  drop() { tone(620, 0.1, 'triangle', 0.07, 330); },
  wave() { tone(523, 0.1, 'sine', 0.1); tone(784, 0.16, 'sine', 0.1, null, 0.08); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, 'triangle', 0.09, null, i * 0.11)); },
  tick() { tone(1700 + Math.random() * 500, 0.014, 'square', 0.01); },
  menu() { tone(720, 0.05, 'triangle', 0.06); },
  ok() { tone(520, 0.08, 'triangle', 0.08); tone(780, 0.12, 'triangle', 0.08, null, 0.06); },
  float() { tone(300 + Math.random() * 200, 0.2, 'sine', 0.025, 600); },
  ding() { tone(1046, 0.5, 'sine', 0.05); tone(784, 0.7, 'sine', 0.045, null, 0.16); },
  liftGo() { tone(70, 0.3, 'triangle', 0.05, 95); },
  well() { tone(180, 0.25, 'sine', 0.12, 520); tone(90, 0.2, 'sine', 0.08, 60, 0.05); },
  step(shade, surf) {
    if (surf === 'glass') return tone(1500 + Math.random() * 300, 0.04, 'sine', shade ? 0.012 : 0.018, 1200);
    if (surf === 'brass') return tone(230 + Math.random() * 30, 0.06, 'square', 0.012, 180);
    if (surf === 'belt') return tone(120 + Math.random() * 20, 0.03, 'square', 0.012, 90);
    shade ? tone(95 + Math.random() * 20, 0.05, 'sine', 0.035, 70) : tone(150 + Math.random() * 40, 0.035, 'triangle', 0.03, 110);
  },
  candle() { tone(240, 0.28, 'sine', 0.07, 520); tone(1320, 0.4, 'sine', 0.025, 1180, 0.08); },
  mirror(on) { on ? (tone(1568, 0.3, 'sine', 0.022), tone(2093, 0.35, 'sine', 0.016, null, 0.05)) : tone(1175, 0.12, 'sine', 0.012, 880); },
  vent() { tone(900, 0.35, 'sawtooth', 0.008, 400); tone(300, 0.3, 'sine', 0.02, 520); },
  drum(soft) { const k = soft ? 0.4 : 1; tone(110, 0.22, 'sine', 0.16 * k, 55); tone(220, 0.08, 'triangle', 0.05 * k, 160); },

    const lg = AC.createGain(); lg.gain.value = 1.2; lfo.connect(lg); lg.connect(o.frequency);

  let deg = 4, beat = 0, wait = 0;

    if (!AC || AC.state !== 'running') return;

    beat++; if (wait-- > 0 || Math.random() > m.busy) return;

// Challenge levels (challenge:true) live after the story and have their own menu.
const MAIN_COUNT = LEVELS.findIndex(d => d.final) + 1;
const SECRET_IDX = LEVELS.findIndex(d => d.secret);
const CH_NUM = [], ROOM_NUM = [], CH_START = [], CH_ROOMS = {};
(() => { let cn = 0, rn = 0; LEVELS.forEach((d, i) => {
  if (d.secret || d.challenge) return;
  if (!d.cont) { cn++; rn = 1; CH_START.push(i); } else rn++;
  CH_NUM[i] = cn; ROOM_NUM[i] = rn; CH_ROOMS[cn] = rn;
}); })();
const CHALLENGES = LEVELS.map((d, i) => d.challenge ? i : -1).filter(i => i >= 0);
// every chapter, room and challenge can be picked from the menus, so a lost save never costs any progress
const challengeOpen = i => true;
const NATIVE = /Electron/.test(navigator.userAgent);
function quitGame() { try { window.close(); } catch (e) {} }

function loadLevel(idx, opts = {}) {
  const def = LEVELS[idx];
  const grid = def.map.map(r => r.split(''));
  lv = { idx, def, grid, time: 0, plates: [], exits: [], occ: [], light: null, lit: new Uint8Array(COLS * ROWS),
    pressed: { p: false, q: false }, doorAnim: { p: 0, q: 0 }, crates: [], drumHit: {}, saidPlate: new Set(), complete: false, completeT: 0, fadeIn: 1, hintsFired: new Set(),
    plateCount: 0, exitWait: 0, exitWaitSaid: false, idle: 0, particles: [], ambient: def.ambient ?? 0.6, exitKind: 'E',
    shadowSaid: false, hooks: [] };
  players = [mkPlayer('wick'), mkPlayer('shade')];
  let lanSpawn = null;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x];
    if (c === 'W' || c === 'S') { const p = players[c === 'W' ? 0 : 1]; p.sx = p.x = x * T + (T - p.w) / 2; p.sy = p.y = (y + 1) * T - p.h; grid[y][x] = '.'; }
    else if (c === 'L') { lanSpawn = [x, y]; grid[y][x] = '.'; }
    else if (c === 'H') { lv.hooks.push({ tx: x, ty: y }); grid[y][x] = '.'; }
    else if (c === 'k') { (lv.wells = lv.wells || []).push({ tx: x, ty: y }); }
    else if (c === 'f') { (lv.vents = lv.vents || []).push({ tx: x, ty: y, top: 0 }); }

  ctx.drawImage(bgCanvas, 0, 0);
  ctx.fillStyle = 'rgba(7,6,15,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f6ecd6'; ctx.font = 'italic bold 60px ' + FONT_D; ctx.fillText('Wick & Shade', W / 2, 120);
  ctx.font = 'italic 22px ' + FONT_B;
  credits.lines.forEach((ln, i) => {
    const a = clamp((credits.t - i * 2.6) / 1.2, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = i === credits.lines.length - 1 ? '#ffd27a' : '#f4ead8';
    ctx.fillText(ln, W / 2, 200 + i * 52);
  });
  const fa = clamp((credits.t - credits.lines.length * 2.6 - 1) / 1.5, 0, 1);
  if (fa > 0) { ctx.globalAlpha = fa * 0.6; ctx.font = '14px ' + FONT_B; ctx.fillStyle = '#f4ead8';
    ctx.fillText('Made for one couch and two people.  ·  Type: Fraunces and Lora (SIL Open Font License)  ·  Every room solved at least once by a very patient robot.', W / 2, 610); }
  ctx.globalAlpha = 1;
  const wx = W / 2 - 40 + Math.sin(t) * 10;
  const a = mkPlayer('wick'); a.x = wx - 30; a.y = 690 - 34; a.onGround = true; a.anim = 0; a.blink = 1;
  const b = mkPlayer('shade'); b.x = wx + 30; b.y = 690 - 34; b.face = -1; b.blink = 1;
  drawWick(a, t); drawShade(b, t); drawMiniLantern(wx - 1, 655);
  if (credits.t > 3) { ctx.font = '15px ' + FONT_B; ctx.fillStyle = 'rgba(244,234,216,0.5)'; ctx.fillText('Press ' + bn('A') + ' to return to the title', W / 2, H - 24); }
}

/* ------------------------------ main loop ------------------------------ */
buildBackground();
let last = performance.now(), gtime = 0, manual = false;
function step(dt) {
  pollInput();
  gtime += dt;
  if (gstate === 'title') updateTitle(dt);
  else if (gstate === 'join') updateJoin(dt);
  else if (gstate === 'play') updatePlay(forced ? dt : dt * (opts.speed || 100) / 100);
  else if (gstate === 'pause') updatePause(dt);
  else if (gstate === 'credits') updateCredits(dt);
  if (gstate === 'play') { if (!forced && menuInput().alt) narr.advance(); narr.update(dt); }
}
function render() {
  if (gstate === 'title') renderTitle(gtime);
  else if (gstate === 'join') renderJoin(gtime);
  else if (gstate === 'play') renderPlay(gtime);
  else if (gstate === 'pause') renderPause(gtime);
  else if (gstate === 'credits') renderCredits(gtime);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!manual) step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* phone controllers: phones show up as extra gamepads (see shared/couch-pads) */
if (window.CouchPads) CouchPads.init({
  game: 'Wick & Shade', accent: '#ffd27a',
  labels: { a: 'Jump', b: 'Use', x: 'Use', y: 'Narrator', start: 'Pause' },
  keys: [], // the join screen already explains two-on-one-keyboard
  hintAt: 'bottom-right',
  screen: () => gstate === 'join' ? 'join' : (gstate === 'title' || gstate === 'pause') ? 'hint' : null,
});

/* test hooks (harmless in normal play) */
window.__ws = {
  get lv() { return lv; }, get players() { return players; }, get lantern() { return lantern; }, get state() { return gstate; },
  isShadow, computeLight, loadLevel: (i) => { startLevel(i); }, step, render,
  setManual(v) { manual = v; }, setForced(f) { forced = f; }, LEVELS, narr,
  setState(s) { gstate = s; },
};
</script>
