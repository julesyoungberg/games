/* ------------------------------ audio ------------------------------ */
let AC = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    startMusic();

}
function tone(f, d, type = 'sine', v = 0.2, f2 = null, delay = 0) {
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}

  drop() { tone(620, 0.1, 'triangle', 0.07, 330); },

function startMusic() {
  const g = AC.createGain(); g.gain.value = 0.03;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  lp.connect(g); g.connect(master);
  [55, 82.41, 110.0, 164.8].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.04 + i * 0.025;
    const lg = AC.createGain(); lg.gain.value = 1.2; lfo.connect(lg); lg.connect(o.frequency);
    const og = AC.createGain(); og.gain.value = i === 3 ? 0.35 : 1; o.connect(og); og.connect(lp); o.start(); lfo.start();
  });
  const scale = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
  setInterval(() => {
    if (!AC || AC.state !== 'running') return;
    if (Math.random() < 0.5) { const f = pick(scale) * (Math.random() < 0.35 ? 0.5 : 1); tone(f, 2.2, 'sine', 0.03); }
  }, 850);
}

/* ------------------------------ input ------------------------------ */
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.code); initAudio();
  if (/^(Space|Arrow|Slash|Period|Enter|Tab|Backspace)/.test(e.code)) e.preventDefault();
  if (e.code === 'F11' || (e.code === 'KeyF' && e.ctrlKey)) { e.preventDefault(); toggleFullscreen(); }

addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
['mousedown', 'touchstart', 'pointerdown'].forEach(ev => addEventListener(ev, initAudio));
function toggleFullscreen() {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}

const K = c => keys.has(c) ? 1 : 0;
let pads = [];
const prevIn = {}, devState = {};
function axis(p, i) { const v = p.axes[i] || 0; return Math.abs(v) < 0.3 ? 0 : v; }
function Bt(p, i) { const b = p.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
function readRaw(dev) {
  if (dev === 'k1') return { mx: K('KeyD') - K('KeyA'), my: K('KeyS') - K('KeyW'), jump: K('Space'), act: K('KeyE') || K('KeyQ'), pause: K('Escape') || K('KeyP'), alt: K('KeyY') || K('Tab') || K('KeyN') };
  if (dev === 'k2') return { mx: K('ArrowRight') - K('ArrowLeft'), my: K('ArrowDown') - K('ArrowUp'), jump: K('Enter') || K('Slash') || K('ShiftRight') || K('Numpad0'), act: K('Period') || K('ControlRight') || K('NumpadDecimal'), pause: K('Backspace'), alt: 0 };
  const m = /^g(\d+)([LR]?)$/.exec(dev); if (!m) return null;
  const p = pads[+m[1]]; if (!p || !p.connected) return null;
  const dl = Bt(p, 14), dr = Bt(p, 15), du = Bt(p, 12), dd = Bt(p, 13);
  if (m[2] === '') {
    let mx = axis(p, 0), my = axis(p, 1); if (dl) mx = -1; if (dr) mx = 1; if (du) my = -1; if (dd) my = 1;
    return { mx, my, jump: Bt(p, 0), act: Bt(p, 2) || Bt(p, 1), pause: Bt(p, 9), alt: Bt(p, 3) };
  }
  if (m[2] === 'L') {
    let mx = axis(p, 0), my = axis(p, 1); if (dl) mx = -1; if (dr) mx = 1; if (du) my = -1; if (dd) my = 1;
    return { mx, my, jump: Bt(p, 4), act: Bt(p, 6) || Bt(p, 10), pause: false, alt: 0 };
  }
  return { mx: axis(p, 2), my: axis(p, 3), jump: Bt(p, 5) || Bt(p, 0), act: Bt(p, 7) || Bt(p, 1) || Bt(p, 11), pause: false, alt: 0 };
}
function pollInput() {
  pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
  const devs = ['k1', 'k2'];
  pads.forEach((p, i) => { if (p && p.connected) devs.push('g' + i, 'g' + i + 'L', 'g' + i + 'R'); });
  for (const d in devState) if (!devs.includes(d)) delete devState[d];
  let any = false;
  for (const d of devs) {
    const r = readRaw(d); if (!r) continue;
    const pv = prevIn[d] || {};
    const dx = r.mx > 0.5 ? 1 : r.mx < -0.5 ? -1 : 0, dy = r.my > 0.5 ? 1 : r.my < -0.5 ? -1 : 0;
    const s = Object.assign({}, r, {
      jumpP: !!r.jump && !pv.jump, actP: !!r.act && !pv.act, pauseP: !!r.pause && !pv.pause, altP: !!r.alt && !pv.alt,
      navX: dx && dx !== pv.dx ? dx : 0, navY: dy && dy !== pv.dy ? dy : 0,
    });
    s.any = s.jumpP || s.actP || s.pauseP || s.navX || s.navY || s.altP;
    if (s.any) any = true;
    devState[d] = s; prevIn[d] = { jump: r.jump, act: r.act, pause: r.pause, alt: r.alt, dx, dy };

}
function menuInput() {
  const o = { navX: 0, navY: 0, ok: false, back: false, pause: false, alt: false, dev: null, altDev: null };
  for (const d in devState) {
    if (/[LR]$/.test(d)) continue;
    const s = devState[d];
    if (s.navX) o.navX = s.navX; if (s.navY) o.navY = s.navY;
    if (s.jumpP) { o.ok = true; o.dev = o.dev || d; }
    if (s.actP) o.back = true; if (s.pauseP) o.pause = true;
    if (s.altP) { o.alt = true; o.altDev = d; }

}

const narr = {
  q: [], cur: null, shown: 0, hold: 0, alpha: 0, deathCd: 0,
  say(t, opt = {}) {
    if (opt.ifQuiet && (this.cur || this.q.length)) return false;
    if (opt.front) this.q.unshift(t); else this.q.push(t);
    return true;
  },
  clear() { this.q = []; this.cur = null; },
  update(dt) {
    this.deathCd -= dt;
    if (!this.cur) {
      this.alpha = Math.max(0, this.alpha - dt * 3);
      if (this.q.length) { this.cur = this.q.shift(); this.shown = 0; this.hold = 0; }
      else return;
    }
    this.alpha = Math.min(1, this.alpha + dt * 4);
    if (this.shown < this.cur.length) {
      const a = Math.floor(this.shown); this.shown += dt * 46;
      const b = Math.floor(this.shown); if (b !== a && b % 2 === 0 && this.cur[b] && this.cur[b] !== ' ') SFX.tick();

      this.hold += dt;

  // Y (controller) / Tab or N (keyboard): finish the line if it's still typing, otherwise move to the next one

    ctx.strokeStyle = 'rgba(255,210,122,0.35)'; ctx.lineWidth = 1.5; roundRect(cx0, 150, cw, 360, 8); ctx.stroke();
    ctx.textAlign = 'left';
    const isCh = menuMode === 'chapters', n = CH_NUM[i], many = CH_ROOMS[n] > 1;
    const title = isCh ? (d.chapter || d.name) : d.name;
    ctx.font = 'bold 30px Georgia, serif'; ctx.fillStyle = '#f6ecd6'; ctx.fillText(title, cx0, 550);
    let meta;
    if (d.challenge) meta = 'Challenge ' + (CHALLENGES.indexOf(i) + 1) + ' of ' + CHALLENGES.length + (save.done && save.done[d.name] ? '   ·   cleared ✓' : '');
    else if (isCh) meta = 'Chapter ' + n + (many ? '   ·   ' + CH_ROOMS[n] + ' rooms' : '') + (save.unlocked > i ? '   ·   visited' : '');
    else meta = 'Room ' + ROOM_NUM[i] + ' of ' + CH_ROOMS[n] + (save.unlocked > i ? '   ·   cleared ✓' : '');
    ctx.font = '16px Georgia, serif'; ctx.fillStyle = 'rgba(255,210,122,0.75)'; ctx.fillText(meta, cx0, 578);
    ctx.font = 'italic 19px Georgia, serif'; ctx.fillStyle = 'rgba(244,234,216,0.72)';
    if (isCh && many) {
      // the rooms in this chapter as a little strip
      const rooms = []; for (let k = i; k < MAIN_COUNT && CH_NUM[k] === n; k++) rooms.push(k);
      const tw = Math.min(104, (cw - (rooms.length - 1) * 14) / rooms.length), tsc = tw / (COLS * 18);
      rooms.forEach((k, j) => { const x = cx0 + j * (tw + 14), y = 600; ctx.drawImage(levelThumb(k, 18), x, y, tw, ROWS * 18 * tsc);
        ctx.strokeStyle = 'rgba(244,234,216,0.25)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, tw - 1, ROWS * 18 * tsc - 1);
        ctx.font = '13px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.55)'; ctx.fillText((j + 1) + '. ' + LEVELS[k].name, x, y + ROWS * 18 * tsc + 18, tw); });
    } else wrapText(d.sub, cx0, 614, cw, 26, 3);
    ctx.restore();
  }
  ctx.font = '15px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.5)'; ctx.textAlign = 'center';
  ctx.fillText('A / Space to choose  ·  D-pad / stick / arrows to move  ·  B / E to go back', W / 2, H - 30);
}
function updateJoin(dt) {
  joinT += dt;
  const mi = menuInput();
  if (mi.back && !assign[0]) { gstate = 'title'; menuMode = 'main'; SFX.menu(); return; }
  if (mi.alt && mi.altDev) {
    if (mi.altDev === 'k1') assign = ['k1', 'k2'];
    else assign = [mi.altDev + 'L', mi.altDev + 'R'];
    SFX.ok(); joinT = 0;
  } else if (mi.ok && mi.dev && !assign.includes(mi.dev) && !(assign[0] && /[LR]$/.test(assign[0])) && gtime - lastJoinAt > 0.3) {
    // a press within 0.3s of the last join is almost always the same physical controller showing up twice
    const slot = assign[0] ? 1 : 0; assign[slot] = mi.dev; SFX.ok(); joinT = 0; lastJoinAt = gtime;
  } else if (mi.back && assign[0]) { assign = [null, null]; SFX.menu(); }
  if (assign[0] && assign[1] && joinT > 1.1) { narr.clear(); startLevel(pendingLevel); }
}
function renderJoin(t) {
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f6ecd6'; ctx.font = 'italic 44px Georgia, serif';
  ctx.fillText('Who is who?', W / 2, 140);
  ctx.font = 'italic 20px Georgia, serif'; ctx.fillStyle = 'rgba(244,234,216,0.75)';
  ctx.fillText('Press A on a controller (or Space / Enter on a keyboard) to join. First in is Wick.', W / 2, 180);
  const cards = [['WICK', 'Carries the lantern. Lights the gold glass.', '#ffd27a'], ['SHADE', 'Stands on shadows. Floats up through them.', '#c4adff']];
  cards.forEach(([nm, desc, c], i) => {
    const x = W / 2 - 330 + i * 360, y = 230;
    ctx.fillStyle = 'rgba(12,9,24,0.7)'; rr(ctx, x, y, 300, 300, 18); ctx.fill();
    ctx.strokeStyle = assign[i] ? c : 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.stroke();
    const fake = mkPlayer(i ? 'shade' : 'wick'); fake.x = x + 138; fake.y = y + 120; fake.onGround = true; fake.anim = t; fake.blink = Math.sin(t * 2 + i) > 0.97 ? -1 : 1;
    ctx.save(); ctx.translate(x + 150, y + 137); ctx.scale(2.2, 2.2); ctx.translate(-(x + 150), -(y + 137));
    i ? drawShade(fake, t) : drawWick(fake, t);
    ctx.restore();
    if (!i) drawMiniLantern(x + 196, y + 90 + Math.sin(t * 2) * 3);
    ctx.fillStyle = c; ctx.font = 'bold 26px Georgia'; ctx.fillText(nm, x + 150, y + 210);
    ctx.fillStyle = 'rgba(244,234,216,0.8)'; ctx.font = 'italic 16px Georgia'; ctx.fillText(desc, x + 150, y + 238);
    ctx.font = 'bold 16px Georgia'; ctx.fillStyle = assign[i] ? '#a8f0d0' : 'rgba(244,234,216,0.5)';
    ctx.fillText(assign[i] ? devName(assign[i]) : (Math.sin(t * 4) > 0 ? 'press A to join' : ''), x + 150, y + 274);
  });
  ctx.font = '17px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.65)';
  ctx.fillText('Only one controller? Press Y on it to split it in half: left side plays Wick, right side plays Shade.', W / 2, 600);
  ctx.fillText('One keyboard for two? Press Y: Wick uses WASD + Space + E, Shade uses the arrows + Enter + period.', W / 2, 628);
  const nPads = Object.keys(devState).filter(d => /^g\d+$/.test(d)).length;
  ctx.fillText(`Controllers connected: ${nPads}   ·   B / E: back`, W / 2, 668);
  if (assign[0] && assign[1]) { ctx.fillStyle = '#ffd27a'; ctx.font = 'italic 26px Georgia'; ctx.fillText('Here we go…', W / 2, 730); }
}
function pauseItems() {
  return [
    { label: 'Resume', act: () => { gstate = 'play'; } },
    { label: (CH_ROOMS[CH_NUM[lv.idx]] || 1) > 1 ? 'Restart room' : 'Restart chapter', act: () => { startLevel(lv.idx, { quietIntro: true }); } },
    { label: lv && lv.def.challenge ? 'Back to challenges' : 'Skip chapter', act: () => { narr.clear(); if (lv.def.challenge) { gstate = 'title'; menuMode = 'challenges'; menuSel = 0; return; } narr.say(LINES.skip); lv.exitKind = 'E'; nextLevel(); } },
    { label: 'Swap Wick and Shade', act: () => { assign = [assign[1], assign[0]]; if (splitMode() === false && assign[0] && /R$/.test(assign[0])) { /* keep halves sane */ } narr.say(LINES.swap, { front: true }); gstate = 'play'; } },
    ...(NATIVE ? [] : [{ label: 'Fullscreen', act: toggleFullscreen }]),
    { label: 'Quit to title', act: () => { gstate = 'title'; menuMode = 'main'; menuSel = 0; narr.clear(); } },
  ];
}
function updatePause(dt) {
  const mi = menuInput();
  if (mi.pause || mi.back) { gstate = 'play'; SFX.menu(); return; }
  runMenu(pauseItems(), mi);
}
function renderPause(t) {
  renderPlay(t);
  ctx.fillStyle = 'rgba(7,6,15,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f6ecd6'; ctx.font = 'italic 48px Georgia, serif'; ctx.fillText('Paused', W / 2, 180);
  ctx.font = 'italic 18px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.6)';
  ctx.fillText('The narrator is also paused. Enjoy the silence.', W / 2, 214);
  drawMenuList(pauseItems(), W / 2, 290);
  ctx.font = '15px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.6)';
  const ct = controlsText(); ctx.fillText(ct[0], W / 2, H - 70); ctx.fillText(ct[1], W / 2, H - 46);
  ctx.fillText(`Wick: ${devName(assign[0])}   ·   Shade: ${devName(assign[1])}`, W / 2, H - 20);
}

/* ------------------------------ credits ------------------------------ */
let credits = null;
function startCredits() {
  gstate = 'credits';
  const mins = run.start ? Math.round((performance.now() - run.start) / 60000) : null;
  credits = { t: 0, lines: [
    'And so Wick and Shade walked through the last door. Together.',
    'Behind it was a couch. On the couch were two people, playing a game.',
    'Which is very meta. I am aware. I was told to be aware.',
    `For the record: Wick fell ${run.deaths[0]} time${run.deaths[0] === 1 ? '' : 's'}. Shade fell ${run.deaths[1]} time${run.deaths[1] === 1 ? '' : 's'}.`,
    `The lantern was put down or thrown ${run.abandon} time${run.abandon === 1 ? '' : 's'}. It has forgiven you. Mostly.`,
    run.deaths[0] === run.deaths[1] ? 'A perfect tie in falling. That is either love or coincidence.' : `I'm not saying ${run.deaths[0] > run.deaths[1] ? 'Wick' : 'Shade'} was the problem. I'm just reading the numbers out loud.`,
    mins ? `You spent about ${mins} minute${mins === 1 ? '' : 's'} together in here. I hope it was nice. I enjoyed it.` : 'I hope you had a nice time together. I did.',
    'Thank you for playing.',
  ] };
  narr.clear();
}
function updateCredits(dt) {
  credits.t += dt;
  const mi = menuInput();
  if ((mi.ok || mi.pause) && credits.t > 3) { gstate = 'title'; menuMode = 'main'; menuSel = 0; }
}
function renderCredits(t) {
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.fillStyle = 'rgba(7,6,15,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f6ecd6'; ctx.font = 'italic bold 60px Georgia, serif'; ctx.fillText('Wick & Shade', W / 2, 120);
  ctx.font = 'italic 22px Georgia, serif';
  credits.lines.forEach((ln, i) => {
    const a = clamp((credits.t - i * 2.6) / 1.2, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = i === credits.lines.length - 1 ? '#ffd27a' : '#f4ead8';
    ctx.fillText(ln, W / 2, 200 + i * 52);
  });
  ctx.globalAlpha = 1;
  const wx = W / 2 - 40 + Math.sin(t) * 10;
  const a = mkPlayer('wick'); a.x = wx - 30; a.y = 690 - 34; a.onGround = true; a.anim = 0; a.blink = 1;
  const b = mkPlayer('shade'); b.x = wx + 30; b.y = 690 - 34; b.face = -1; b.blink = 1;
  drawWick(a, t); drawShade(b, t); drawMiniLantern(wx - 1, 655);
  if (credits.t > 3) { ctx.font = '15px Georgia'; ctx.fillStyle = 'rgba(244,234,216,0.5)'; ctx.fillText('Press A to return to the title', W / 2, H - 24); }
}

/* ------------------------------ main loop ------------------------------ */
buildBackground();
let last = performance.now(), gtime = 0, manual = false;
function step(dt) {
  pollInput();
  gtime += dt;
  if (gstate === 'title') updateTitle(dt);
  else if (gstate === 'join') updateJoin(dt);
  else if (gstate === 'play') updatePlay(dt);
  else if (gstate === 'pause') updatePause(dt);
  else if (gstate === 'credits') updateCredits(dt);
  if (gstate === 'play') { if (!forced && menuInput().alt) narr.advance(); narr.update(dt); }
}
function render() {
  if (gstate === 'title') renderTitle(gtime);
  else if (gstate === 'join') renderJoin(gtime);
  else if (gstate === 'play') renderPlay(gtime);
  else if (gstate === 'pause') renderPause(gtime);
  else if (gstate === 'credits') renderCredits(gtime);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!manual) step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* test hooks (harmless in normal play) */
window.__ws = {
  get lv() { return lv; }, get players() { return players; }, get lantern() { return lantern; }, get state() { return gstate; },
  isShadow, computeLight, loadLevel: (i) => { startLevel(i); }, step, render,
  setManual(v) { manual = v; }, setForced(f) { forced = f; }, LEVELS, narr,
  setState(s) { gstate = s; },
};
