<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Couch Co-op Games</title>
<meta name="description" content="Original two-player couch co-op games for the Steam Deck and the browser.">
<link rel="icon" href="/wick-and-shade/icon.png">
<style>
  :root{--ink:#f4efe6;--dim:rgba(244,239,230,.7);--page:#0d0b14}
  *{box-sizing:border-box}
  html{background:var(--page)}
  body{margin:0;min-height:100vh;color:var(--ink);font:18px/1.5 "Trebuchet MS","DejaVu Sans",Verdana,sans-serif;background:radial-gradient(ellipse at 20% 0%,#2a2140 0,#14111f 50%,var(--page) 100%) fixed}
  main{max-width:860px;margin:0 auto;padding:48px 16px 64px}
  h1{margin:0;font-size:clamp(40px,8vw,68px);line-height:1;font-weight:900;letter-spacing:-1px}
  .lede{color:var(--dim);margin:12px 0 36px;font-size:20px}
  .games{display:grid;gap:20px}
  .game{display:flex;gap:20px;align-items:flex-start;background:var(--bg);border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;padding:20px}
  .art img{display:block;width:96px;height:96px;border-radius:18px;background:rgba(255,255,255,.06)}
  .body{flex:1;min-width:0}
  h2{margin:0;font-size:30px;line-height:1.1}
  h2 a{color:var(--accent);text-decoration:none}
  .meta{margin:4px 0 8px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .tag{margin:0 0 14px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  a.btn{display:inline-block;text-decoration:none;border-radius:12px;padding:10px 16px;font-weight:bold;font-size:17px;outline:none;transition:transform .1s,box-shadow .1s}
  a.play{background:var(--accent);color:#1a1424}
  a.dl,a.more{color:var(--ink);border:2px solid rgba(255,255,255,.25)}
  a.btn:hover,a.btn:focus-visible{transform:scale(1.03);box-shadow:0 0 0 3px #fff}
  footer{margin-top:32px;color:var(--dim);font-size:14px;text-align:center}
  @media (max-width:540px){.game{flex-direction:column}.art img{width:72px;height:72px}}
</style>
</head>
<body>
<main>
  <h1>Couch Co-op Games</h1>
  <p class="lede">Original games for two players on one Steam Deck, or in any browser with two controllers.</p>
  <section class="games"><!--GAMES-->
  </section>
  <footer>Progress saves on the device you play on.</footer>
</main>
</body>
</html>
